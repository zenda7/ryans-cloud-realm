<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>莱恩的云上国度 - 美国信用卡情报库</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f2f7fb;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 顶部 Banner */
        .banner {
            background: #ffffff;
            border-radius: 20px;
            padding: 24px 16px;
            text-align: center;
            box-shadow: 0 4px 12px rgba(0, 80, 160, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .banner-title {
            font-size: 20px;
            font-weight: 700;
            color: #1677ff;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .banner-subtitle {
            font-size: 13px;
            color: #597ef7;
            font-weight: 500;
        }

        /* 导航 Tab */
        .tabs {
            background: #ffffff;
            border-radius: 16px;
            padding: 6px;
            display: flex;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
        }

        .tab-btn {
            flex: 1;
            border: none;
            background: transparent;
            padding: 12px 8px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            color: #595959;
            cursor: pointer;
            text-align: center;
        }

        .tab-btn.active {
            background: #007aff;
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(0, 122, 255, 0.3);
        }

        /* 提示文字 & 返回按钮 */
        .tip-text {
            font-size: 13px;
            color: #8c8c8c;
            padding: 0 4px;
        }

        .back-bar {
            display: none;
            align-items: center;
            gap: 6px;
            color: #007aff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            padding: 4px 0;
        }

        .back-bar.visible {
            display: flex;
        }

        /* 银行列表区域 */
        .bank-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .bank-card {
            background: #ffffff;
            border: 1.5px solid #e6f0fa;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .bank-card:active {
            transform: scale(0.98);
        }

        .bank-logo {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            object-fit: cover;
            background: #f0f5ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .bank-info .en-name {
            font-size: 16px;
            font-weight: 700;
            color: #1f1f1f;
        }

        .bank-info .zh-name {
            font-size: 12px;
            color: #8c8c8c;
        }

        /* 选中态：隐藏其他银行，只留当前点击项 */
        .bank-card.hidden {
            display: none !important;
        }

        .bank-card.selected-active {
            border-color: #007aff;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.12);
            cursor: default;
        }

        /* 信用卡展示区 */
        .cards-container {
            display: none;
            flex-direction: column;
            gap: 12px;
            opacity: 0;
            transform: translateY(12px);
            transition: all 0.3s ease;
        }

        .cards-container.visible {
            display: flex;
            opacity: 1;
            transform: translateY(0);
        }

        .card-item {
            background: #ffffff;
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            border: 1px solid #f0f0f0;
        }

        .card-face {
            width: 52px;
            height: 33px;
            background: linear-gradient(135deg, #1890ff, #096dd9);
            border-radius: 6px;
            flex-shrink: 0;
        }

        .card-details {
            flex: 1;
        }

        .card-name {
            font-size: 14px;
            font-weight: 600;
            color: #262626;
        }

        .card-sub {
            font-size: 12px;
            color: #8c8c8c;
        }

        .card-badge {
            font-size: 11px;
            background: #e6f7ff;
            color: #1890ff;
            padding: 2px 8px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 顶部个人 Header -->
        <div class="banner">
            <div class="banner-title">☁️ 莱恩的云上国度</div>
            <div class="banner-subtitle">云居民的美国信用卡情报库</div>
        </div>

        <!-- 导航选项卡 -->
        <div class="tabs">
            <button class="tab-btn">1. 必要准备</button>
            <button class="tab-btn">2. 申卡指南</button>
            <button class="tab-btn active">3. 卡片大全</button>
        </div>

        <!-- 返回按钮与提示文案 -->
        <div class="back-bar" id="backBar" onclick="goBackToBanks()">
            <span>← 返回选择其他银行</span>
        </div>
        <div class="tip-text" id="tipText">👇 **点击下方银行，查看对应旗下的信用卡列表：**</div>

        <!-- 银行列表 -->
        <div class="bank-list" id="bankList">
            <!-- Amex -->
            <div class="bank-card" onclick="selectBank(this, 'amex')">
                <div class="bank-logo">💳</div>
                <div class="bank-info">
                    <div class="en-name">American Express</div>
                    <div class="zh-name">美国运通</div>
                </div>
            </div>

            <!-- Chase -->
            <div class="bank-card" onclick="selectBank(this, 'chase')">
                <div class="bank-logo">🏦</div>
                <div class="bank-info">
                    <div class="en-name">Chase</div>
                    <div class="zh-name">大通银行</div>
                </div>
            </div>

            <!-- Capital One -->
            <div class="bank-card" onclick="selectBank(this, 'capone')">
                <div class="bank-logo">🌐</div>
                <div class="bank-info">
                    <div class="en-name">Capital One</div>
                    <div class="zh-name">第一资本银行</div>
                </div>
            </div>
        </div>

        <!-- 展开的信用卡列表区域 -->
        <div class="cards-container" id="cardsContainer"></div>
    </div>

    <script>
        // 信用卡数据
        const cardData = {
            amex: [
                { name: "Hilton Honors", desc: "免年费小白卡 / 希尔顿入门", tag: "免年费" },
                { name: "Gold Card", desc: "餐饮超市 4x 积分神器", tag: "消费必选" },
                { name: "Platinum Card", desc: "顶级机场休息室权益", tag: "高端卡" }
            ],
            chase: [
                { name: "Sapphire Preferred", desc: "经典 UR 积分入门卡", tag: "热门推荐" },
                { name: "Freedom Unlimited", desc: "无脑 1.5% 返现卡", tag: "免年费" }
            ],
            capone: [
                { name: "Venture X", desc: "高性价比高端旅行卡", tag: "等效负年费" }
            ]
        };

        let isSelected = false;

        function selectBank(element, bankKey) {
            if (isSelected) return;
            isSelected = true;

            // 1. 隐藏提示文本，显示返回按钮
            document.getElementById('tipText').style.display = 'none';
            document.getElementById('backBar').classList.add('visible');

            // 2. 隐藏其他银行，当前选中的银行保留在最上方
            const allBanks = document.querySelectorAll('.bank-card');
            allBanks.forEach(card => {
                if (card === element) {
                    card.classList.add('selected-active');
                } else {
                    card.classList.add('hidden');
                }
            });

            // 3. 渲染并显示对应卡片
            const container = document.getElementById('cardsContainer');
            const list = cardData[bankKey] || [];
            
            container.innerHTML = list.map(c => `
                <div class="card-item">
                    <div class="card-face"></div>
                    <div class="card-details">
                        <div class="card-name">${c.name}</div>
                        <div class="card-sub">${c.desc}</div>
                    </div>
                    <div class="card-badge">${c.tag}</div>
                </div>
            `).join('');

            container.classList.add('visible');
        }

        function goBackToBanks() {
            if (!isSelected) return;
            isSelected = false;

            document.getElementById('tipText').style.display = 'block';
            document.getElementById('backBar').classList.remove('visible');

            const container = document.getElementById('cardsContainer');
            container.classList.remove('visible');

            setTimeout(() => {
                const allBanks = document.querySelectorAll('.bank-card');
                allBanks.forEach(card => {
                    card.classList.remove('hidden', 'selected-active');
                });
                container.innerHTML = '';
            }, 150);
        }
    </script>
</body>
</html>
